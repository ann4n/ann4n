plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'app.mcpbrowser'
    compileSdk 35

    defaultConfig {
        applicationId 'app.mcpbrowser'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
