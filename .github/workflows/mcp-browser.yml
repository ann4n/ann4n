name: mcp-browser

on:
  push:
    paths: ['mcp-browser/**', '.github/workflows/mcp-browser.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-browser-apk
          path: mcp-browser/build/outputs/apk/debug/mcp-browser-debug.apk
